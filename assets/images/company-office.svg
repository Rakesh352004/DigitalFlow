<svg width="300" height="300" viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="companyGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="300" height="300" fill="#f8f9fa" rx="10"/>
  
  <!-- Company building shape -->
  <rect x="80" y="120" width="140" height="140" fill="url(#companyGradient)" rx="5"/>
  
  <!-- Windows -->
  <rect x="95" y="135" width="25" height="25" fill="white" opacity="0.3"/>
  <rect x="130" y="135" width="25" height="25" fill="white" opacity="0.3"/>
  <rect x="165" y="135" width="25" height="25" fill="white" opacity="0.3"/>
  
  <rect x="95" y="170" width="25" height="25" fill="white" opacity="0.3"/>
  <rect x="130" y="170" width="25" height="25" fill="white" opacity="0.3"/>
  <rect x="165" y="170" width="25" height="25" fill="white" opacity="0.3"/>
  
  <rect x="95" y="205" width="25" height="25" fill="white" opacity="0.3"/>
  <rect x="130" y="205" width="25" height="25" fill="white" opacity="0.3"/>
  <rect x="165" y="205" width="25" height="25" fill="white" opacity="0.3"/>
  
  <!-- Door -->
  <rect x="135" y="230" width="30" height="30" fill="white" opacity="0.4"/>
  
  <!-- Roof -->
  <polygon points="80,120 220,120 150,80" fill="url(#companyGradient)" opacity="0.8"/>
  
  <!-- Flag on roof -->
  <rect x="145" y="50" width="10" height="30" fill="white" opacity="0.6"/>
  <polygon points="155,55 155,65 170,60" fill="#667eea"/>
  
  <!-- Text below -->
  <text x="150" y="290" font-size="16" font-weight="bold" text-anchor="middle" fill="#667eea" font-family="Arial">DigitalFlow Agency</text>
</svg>
