<svg width="200" height="60" viewBox="0 0 200 60" xmlns="http://www.w3.org/2000/svg">
  <!-- Logo background -->
  <rect width="60" height="60" rx="10" fill="url(#gradient)"/>
  
  <!-- Logo text icon -->
  <text x="30" y="40" font-size="32" font-weight="bold" text-anchor="middle" fill="white" font-family="Arial">DF</text>
  
  <!-- Company name -->
  <text x="75" y="25" font-size="18" font-weight="bold" fill="#667eea" font-family="Arial">DigitalFlow</text>
  <text x="75" y="45" font-size="11" fill="#764ba2" font-family="Arial">Digital Marketing</text>
  
  <!-- Gradient definition -->
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>
</svg>
